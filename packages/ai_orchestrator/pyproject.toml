[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Future orchestration layer for AI routing and prompt decisions."
requires-python = ">=3.13,<3.15"
dependencies = [
    "ai-provider",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orchestrator"]
