repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check --fix
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
        # Sibling-tree mirrors live under the sibling repo's own ruff config
        # (verified via overlay lint/test before commit); workbench rules
        # misfire on them (e.g. pre-existing E731) and reformat whole files.
        exclude: ^patches/operator-[^/]+/(src|tests)/

      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/ruff.exe format
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
        # Same as above: never reformat sibling mirrors with workbench style.
        exclude: ^patches/operator-[^/]+/(src|tests)/

      - id: pyright
        name: pyright
        entry: .venv/Scripts/pyright.exe
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe scripts/run-tests.py full
        language: system
        pass_filenames: false
        stages: [pre-push]
