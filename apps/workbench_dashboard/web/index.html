<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <nav id="nav">
    <a href="#/home" data-view="home">Home</a>
    <a href="#/chat" data-view="chat">Chat</a>
    <a href="#/plans" data-view="plans">Plans</a>
    <a href="#/runs" data-view="runs">Runs</a>
    <a href="#/inbox" data-view="inbox">Inbox <span id="inbox-badge" class="badge" hidden></span></a>
    <a href="#/ideas" data-view="ideas">Ideas <span id="ideas-badge" class="badge" hidden></span></a>
    <a href="#/schedule" data-view="schedule">Schedule</a>
  </nav>
  <div id="create-wrap">
    <button id="create-btn" title="New chat, plan note, or inbox item">+ New</button>
    <div id="create-menu" hidden>
      <button data-create="chat">New chat</button>
      <button data-create="inbox">New inbox item</button>
      <button data-create="idea">New idea</button>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
