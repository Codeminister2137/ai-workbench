[project]
name = "ai-agent"
version = "0.1.0"
description = "Agentic tool registry, permissions, and multi-turn execution loop for coding workflows."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ai-provider",
    "ai-orchestrator",
]

[project.optional-dependencies]
ide = ["mcp>=2.3,<3"]
rename-preview = ["jedi==0.20.0"]

[project.scripts]
ai-agent-mcp = "ai_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]
