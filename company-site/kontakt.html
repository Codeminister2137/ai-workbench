<h1>Kontakt</h1>
<p>Napisz, czym zajmuje sie Twoja firma i ktora powtarzalna praca zabiera najwiecej czasu. Odpowiadamy z propozycja rozpoznania.</p>

<h2>Zapytanie ofertowe</h2>
<p class="muted" id="intake-steps"></p>
<form id="intake-form">
<p><label>Tytuł projektu<br><input type="text" id="f-title" size="50"></label></p>
<p><label>Imię i nazwisko<br><input type="text" id="f-name" size="50"></label></p>
<p><label>E-mail<br><input type="text" id="f-email" size="50"></label></p>
<p><label>Firma<br><input type="text" id="f-company" size="50"></label></p>
<p><label>Co chcesz osiągnąć?<br><textarea id="f-goal" rows="3" cols="50"></textarea></label></p>
<p><label>Opis problemu (opcjonalnie)<br><textarea id="f-problem" rows="3" cols="50"></textarea></label></p>
<p><label>Cel marketingowy (opcjonalnie)<br><input type="text" id="f-goals" size="50"></label></p>
<p><label>Przedział budżetu (PLN)<br><select id="f-budget"><option value="">— wybierz —</option></select></label></p>
<p><button type="submit">Przygotuj zapytanie</button></p>
</form>
<div id="intake-errors"></div>
<div id="intake-result" hidden>
<p class="muted" id="intake-note"></p>
<pre id="intake-json"></pre>
<p><a id="intake-download" href="#" download="zapytanie.json">Pobierz JSON</a> <button type="button" id="intake-copy">Kopiuj</button></p>
</div>
