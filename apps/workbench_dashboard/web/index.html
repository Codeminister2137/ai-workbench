<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Dashboard</title>
<link rel="stylesheet" href="style-tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <nav id="nav">
    <a href="#/home" data-view="home" title="Status overview">Home</a>
    <a href="#/chat" data-view="chat" title="Supervisor chat sessions">Chat</a>
    <a href="#/plans" data-view="plans" title="Plans on file">Plans</a>
    <a href="#/runs" data-view="runs" title="Runs and route evidence">Runs</a>
    <a href="#/inbox" data-view="inbox" title="Owner inbox tasks">Inbox <span id="inbox-badge" class="badge" hidden></span></a>
    <a href="#/ideas" data-view="ideas" title="Captured ideas to triage">Ideas <span id="ideas-badge" class="badge" hidden></span></a>
    <a href="#/backlog" data-view="backlog" title="Groomed backlog before inbox briefs">Backlog <span id="backlog-badge" class="badge" hidden></span></a>
    <a href="#/invoices" data-view="invoices" title="Invoice drafts: create, review, approve">Invoices</a>
    <a href="#/workflows" data-view="workflows" title="Workflows: compose node lists over existing runners">Workflows</a>
    <a href="#/projects" data-view="projects" title="Projects: work roots, book manuscripts, manuscript checks">Projects</a>
    <a href="#/meetings" data-view="meetings" title="Meetings: transcripts plus confirmed AI action items">Meetings</a>
    <a href="#/documents" data-view="documents" title="Company documents and research library">Documents</a>
    <a href="#/intake" data-view="intake" title="Client briefs awaiting review">Intake</a>
    <a href="#/schedule" data-view="schedule" title="Schedule: upcoming runs, live from the fleet probe">Schedule</a>
    <a href="#/fleet" data-view="fleet" title="Fleet: watchdogs, servers, sleep guard, active runs">Fleet</a>
    <a href="#/providers" data-view="providers" title="Providers: connection status, keys, model catalogue">Providers</a>
    <a href="#/restrictions" data-view="restrictions" title="Agent restriction dimensions (read-only overview)">Restrictions</a>
    <a href="#/knowme" data-view="knowme" title="Know-me bank: personal entries by category">KnowMe</a>
    <a href="#/help" data-view="help" title="Help: runbook and troubleshooting">Help</a>
  </nav>
  <div id="create-wrap">
    <button id="create-btn" title="New chat, plan note, inbox item, idea, or backlog item">+ New</button>
    <div id="create-menu" hidden>
      <button data-create="chat" title="Start a supervisor chat">New chat</button>
      <button data-create="inbox" title="Add an inbox task">New inbox item</button>
      <button data-create="idea" title="Capture an idea">New idea</button>
      <button data-create="backlog" title="File a backlog item">New backlog item</button>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toasts" aria-live="polite"></div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
