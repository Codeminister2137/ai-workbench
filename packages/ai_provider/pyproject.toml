[project]
name = "ai-provider"
version = "0.1.0"
description = "Provider-agnostic AI request contracts and adapters."
requires-python = ">=3.13,<3.15"
dependencies = []

[project.scripts]
ai-assistant = "ai_provider.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_provider"]
